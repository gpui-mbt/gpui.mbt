name: Inspect retained IME failure status
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-ime-failure.yml'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: gpui-mbt/gpui.mbt
          run-id: 41071517137
          artifact-ids: 12984694031
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/ime-retained-diagnostic
      - name: Print bounded status only
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/ime-retained-diagnostic
        run: |
          python3 - <<'PY'
          import json, os, re, stat
          from pathlib import Path

          root = Path(os.environ['ARTIFACT_ROOT'])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('artifact root invalid')
          def read(name):
              if name not in {'execution-status.json', 'stages.json', 'bind.log', 'overlay.log', 'native.log'}:
                  raise ValueError('unrecognized file')
              p = root / name
              try:
                  info = p.lstat()
              except FileNotFoundError:
                  return None
              if not stat.S_ISREG(info.st_mode) or info.st_size > 65536:
                  raise ValueError('non-regular or oversized status file')
              return p.read_text(encoding='utf-8', errors='strict')
          def safe(value):
              if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9 _./:-]{1,300}', value):
                  return '[redacted or invalid]'
              if re.search(r'(token|secret|password|credential|https?:)', value, re.I):
                  return '[redacted or invalid]'
              return value
          raw = read('execution-status.json')
          if raw is None:
              raise ValueError('execution status absent')
          value = json.loads(raw)
          print('native_status:', safe(value.get('native_status')))
          print('status_stage:', safe(value.get('stage')))
          print('status_error:', safe(value.get('error')))
          raw = read('stages.json')
          if raw is not None:
              stages = json.loads(raw)
              if not isinstance(stages, list) or len(stages) > 3:
                  raise ValueError('invalid stages')
              for stage in stages:
                  if stage.get('stage') not in ('bind', 'overlay', 'native') or type(stage.get('returncode')) is not int:
                      raise ValueError('invalid stage record')
                  print('stage:', stage['stage'], 'returncode:', stage['returncode'])
          for name in ('bind.log', 'overlay.log', 'native.log'):
              raw = read(name)
              if raw:
                  print(name + ' last line:', safe(raw.splitlines()[-1]))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: gpui-mbt/gpui.mbt
          run-id: 40438828021
          artifact-ids: 12706040730
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/ime-prepared-review
      - name: Inspect bounded preparation package inventory
        env:
          REVIEW_ROOT: ${{ runner.temp }}/ime-prepared-review
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, stat
          from pathlib import Path
          root = Path(os.environ['REVIEW_ROOT'])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('review root invalid')
          def read(name):
              if name not in ('prepare-result.json', 'host.log', 'host-executables.json'):
                  raise ValueError('unexpected file')
              p = root / name
              s = p.lstat()
              if not stat.S_ISREG(s.st_mode) or s.st_size > 1048576:
                  raise ValueError('invalid review file')
              return p.read_bytes()
          result = json.loads(read('prepare-result.json'))
          raw = read('host.log')
          print('host inventory digest matches prepare result:', hashlib.sha256(raw).hexdigest() == result['host_inventory_sha256'])
          for line in raw.decode('utf-8').splitlines():
              if re.fullmatch(r'(imagemagick(?:-7(?:-common|\.q16))?|libmagick(?:core|wand)-7\.q16-10(?::amd64)?|libc6(?::amd64)?|python3|dbus-daemon|fontconfig|pkgconf|gcc-14)\s+[A-Za-z0-9.+:~_-]+', line):
                  print('prepared package:', line)
          executables = json.loads(read('host-executables.json'))
          for name in ('/usr/bin/convert', '/usr/bin/dbus-daemon', '/usr/bin/python3'):
              row = executables['host_executables'][name]
              sha = row['sha256']
              if not re.fullmatch('[0-9a-f]{64}', sha):
                  raise ValueError('invalid host hash')
              print('prepared executable:', name, sha)
          PY
