name: Contracts, M1 core, M2 element, and M3 scene foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate document contracts and release evidence ledger
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s tests/shared-ui-host -p 'test_*.py'
          python3 scripts/check_contracts.py

  moonbit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Prepare Ubuntu native system boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev libpango1.0-dev libfontconfig1-dev fontconfig fonts-dejavu-core fonts-dejavu-extra fonts-noto-cjk fonts-noto-color-emoji
          dpkg-query -W libpango1.0-dev libpango-1.0-0 libpangoft2-1.0-0 libfontconfig1-dev libfontconfig1 fontconfig fonts-dejavu-core fonts-dejavu-extra fonts-noto-cjk fonts-noto-color-emoji
          pkg-config --modversion pangoft2 fontconfig
          sh scripts/prepare_ubuntu.sh
      - name: Show pinned toolchain
        run: moon version --all
      - name: Generate Ubuntu public interface snapshot
        run: moon info --target native --package f4ah6o/gpui/ubuntu
      - name: Copy generated Ubuntu public interface snapshot
        run: cp _build/native/debug/check/ubuntu/ubuntu.mbti ubuntu/pkg.generated.mbti
      - name: Upload generated Ubuntu interface candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-generated-interface
          path: ubuntu/pkg.generated.mbti
          if-no-files-found: error
      - name: Verify generated Ubuntu public interface is committed
        run: git diff --exit-code -- ubuntu/pkg.generated.mbti
      - name: Verify generated X11 public interface is committed
        run: |
          moon info --target native --package f4ah6o/gpui/x11
          cp _build/native/debug/check/x11/x11.mbti x11/pkg.generated.mbti
          git diff --exit-code -- x11/pkg.generated.mbti
      - name: Test native X11 contracts without a display
        run: sh tests/x11/run_contract.sh
      - name: Check formatting
        run: moon fmt --check
      - name: Test the prebuild hook
        run: moon test script/macos_text_prebuild.mbtx
      - name: Check all targets with warnings denied
        run: moon check --target all --deny-warn
      - name: Test all targets with warnings denied
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/linux_text/fonts.conf
          FONTCONFIG_PATH: ${{ github.workspace }}/tests/linux_text
          XDG_CACHE_HOME: ${{ runner.temp }}/gpui-contract-font-cache
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          sh scripts/check_linux_text_fonts.sh
          env -u DISPLAY -u WAYLAND_DISPLAY moon test --target all --deny-warn

      - name: Checkout pinned legacy Yami Button fixture dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: f4ah6o/Yami-kumo
          ref: ea3ee7ce8e507759c5afec582c1c9592f374f343
          path: _build/shared-ui-audit/yami
      - name: Compare both public Button APIs on each compiler target
        run: |
          for target in js native wasm wasm-gc; do
            python3 scripts/audit_shared_ui_buttons.py --yami-source _build/shared-ui-audit/yami --target "$target" --output "_build/shared-ui-audit/evidence/$target"
          done
      - name: Retain shared Button contract audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-ui-button-audit
          path: _build/shared-ui-audit/evidence
          if-no-files-found: error

  mcp-stdio-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
      - name: Build and test MoonBit MCP stdio endpoint and check generated inventory
        run: |
          moon version --all
          node --version
          sh scripts/test_mcp_stdio.sh

  macos-native-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.15+943464bfa
          core-version: 0.10.15+943464bfa
      - name: Build native app bundle and E2E runner; test portable contracts
        run: |
          mkdir -p _build/macos
          set -o pipefail
          moon version --all | tee _build/macos/toolchain.log
          moon test --package f4ah6o/gpui/accessibility --target native --deny-warn --no-parallelize 2>&1 | tee _build/macos/accessibility.log
          python3 -m unittest tests.test_accessibility_owner_id_allocator
          moon test --package f4ah6o/gpui/platform/macos --target native --deny-warn 2>&1 | tee _build/macos/headless.log
          moon test --package f4ah6o/gpui/platform/macos_app --target native --deny-warn 2>&1 | tee _build/macos/app-coretext.log
          /bin/bash --version | tee _build/macos/system-bash.log
          python3 -m unittest tests.test_build_macos_app -v 2>&1 | tee _build/macos/app-builder-contracts.log
          python3 scripts/test_macos_app_consumer.py --output _build/macos/app-consumer 2>&1 | tee _build/macos/app-consumer.log
          sh script/test_macos_background_policy.sh 2>&1 | tee _build/macos/background-policy.log
          ./script/build_and_run.sh --build 2>&1 | tee _build/macos/build.log
          ./script/test_macos.sh --build-only 2>&1 | tee _build/macos/e2e-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-native-build
          path: _build/macos/
