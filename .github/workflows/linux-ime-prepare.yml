name: Linux IME prepare-only closure
on:
  pull_request:
    paths:
      - '.github/workflows/linux-ime-prepare.yml'
      - 'infra/linux-desktop/ci-ime-prepare.py'
      - 'infra/linux-desktop/tests/test_ci_ime_prepare.py'
      - 'infra/linux-desktop/mozc-prefix/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-only:
    runs-on: ubuntu-24.04
    container: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Install official build prerequisites
        run: |
          prerequisites_failed() {
            mkdir -p "$RUNNER_TEMP/gpui-ime-review"
            echo '{"preparation_status":"FAIL","native_status":"NOT_RUN","approved_for_execution":false,"reason":"Host prerequisite install failed"}' > "$RUNNER_TEMP/gpui-ime-review/prepare-result.json"
          }
          trap prerequisites_failed ERR
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl build-essential pkg-config python3 python3-pil dbus-daemon libgtk-3-0t64 libgtk2.0-0t64 libgspell-1-3 weston gir1.2-gtk-3.0 gir1.2-ibus-1.0 libunwind8 libgl1 x11-xkb-utils libegl1 libgles2 libgl1-mesa-dri libgbm1 libx11-6 libxtst6 libxfont2 libxrender1 libxext6 libxfixes3 libxau6 libxdmcp6 libpixman-1-0 libepoxy0 libdrm2 libudev1 libinput10 libxcb1 libxcursor1 libxkbcommon0 libwayland-client0 libwayland-server0 libwayland-cursor0 libwayland-egl1 imagemagick tesseract-ocr tesseract-ocr-eng patch xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test preparation boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s infra/linux-desktop/tests -p test_ci_ime_prepare.py -v
      - name: Build without launching native input or IME
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GPUI_CONTAINER_IMAGE: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 infra/linux-desktop/ci-ime-prepare.py \
            --root "$RUNNER_TEMP/gpui-ime-closure" \
            --evidence "$RUNNER_TEMP/gpui-ime-review"
      - name: Preserve setup failure status
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/gpui-ime-review/prepare-result.json" ]; then
            mkdir -p "$RUNNER_TEMP/gpui-ime-review"
            echo '{"preparation_status":"INCOMPLETE","native_status":"NOT_RUN","approved_for_execution":false,"reason":"Preparation did not reach its status writer; inspect workflow logs"}' > "$RUNNER_TEMP/gpui-ime-review/prepare-result.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-ime-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/gpui-ime-review/
            !${{ runner.temp }}/gpui-ime-review/runtime-closure.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: linux-ime-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/gpui-ime-review/runtime-closure.tar.gz
          compression-level: 0
          if-no-files-found: error
